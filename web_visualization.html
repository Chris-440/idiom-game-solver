<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成语接龙博弈分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
        }
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        header p { font-size: 1.1em; opacity: 0.9; }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
            background: rgba(0,0,0,0.3);
        }
        .stat-card {
            text-align: center;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-card .label { font-size: 0.8em; opacity: 0.6; margin-bottom: 5px; }
        .stat-card .value { font-size: 1.8em; font-weight: bold; }
        .stat-card.winning .value { color: #00e676; }
        .stat-card.losing .value { color: #ff5252; }
        .stat-card.info .value { color: #448aff; }
        .stat-card.gold .value { color: #ffd740; }

        .tabs {
            display: flex;
            background: rgba(0,0,0,0.2);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        .tab {
            flex: 1;
            padding: 15px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            border: none;
            background: transparent;
            font-size: 1em;
            color: #aaa;
        }
        .tab:hover { background: rgba(255,255,255,0.05); color: white; }
        .tab.active { background: rgba(255,255,255,0.1); border-bottom: 3px solid #667eea; color: white; }

        .tab-content { display: none; padding: 30px; }
        .tab-content.active { display: block; }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .chart-card {
            background: rgba(255,255,255,0.03);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .chart-card h3 {
            margin-bottom: 15px;
            color: #448aff;
            font-size: 1.1em;
        }
        .chart-container {
            position: relative;
            height: 300px;
        }

        .query-section {
            max-width: 800px;
            margin: 0 auto;
        }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .input-group input {
            flex: 1;
            padding: 15px;
            font-size: 1.1em;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            outline: none;
            background: rgba(0,0,0,0.3);
            color: white;
            transition: border-color 0.3s;
        }
        .input-group input:focus { border-color: #667eea; }
        .input-group input::placeholder { color: rgba(255,255,255,0.3); }
        .input-group button {
            padding: 15px 30px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .input-group button:hover { transform: scale(1.05); }

        .result-box {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            margin-top: 20px;
        }
        .result-box h4 { color: #448aff; margin-bottom: 15px; }
        .idiom-display { font-size: 1.5em; font-weight: bold; margin: 10px 0; }

        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
        }
        .badge.winning { background: rgba(0, 230, 118, 0.15); color: #00e676; border: 1px solid #00e676; }
        .badge.losing { background: rgba(255, 82, 82, 0.15); color: #ff5252; border: 1px solid #ff5252; }

        .loading { text-align: center; padding: 80px; font-size: 1.2em; color: #888; }
        .error { background: rgba(255, 82, 82, 0.15); color: #ff5252; padding: 15px; border-radius: 10px; margin: 20px 0; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table th, table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
        table th { background: rgba(255,255,255,0.03); font-weight: 600; color: #448aff; }
        
        .progress-bar {
            width: 200px; height: 4px; background: rgba(255,255,255,0.1);
            border-radius: 2px; margin: 20px auto; overflow: hidden;
        }
        .progress-bar .progress {
            height: 100%; background: linear-gradient(90deg, #667eea, #764ba2);
            animation: loading 2s ease-in-out infinite;
        }
        @keyframes loading {
            0% { width: 0; margin-left: 0; }
            50% { width: 50%; margin-left: 25%; }
            100% { width: 0; margin-left: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐉 成语接龙博弈分析</h1>
            <p>基于 Self-play Q-Learning (跟踪已使用成语) · 全量 29,502 个成语</p>
        </header>

        <div class="stats-bar" id="stats-bar">
            <div class="loading"><div class="progress-bar"><div class="progress"></div></div>加载中...</div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('overview', event)">数据概览</button>
            <button class="tab" onclick="switchTab('query', event)">交互查询</button>
            <button class="tab" onclick="switchTab('analysis', event)">密度分析</button>
        </div>

        <div id="overview" class="tab-content active">
            <div class="chart-grid">
                <div class="chart-card">
                    <h3>📊 必胜/必败态分布</h3>
                    <div class="chart-container"><canvas id="chart-winloss"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>📈 出度分布</h3>
                    <div class="chart-container"><canvas id="chart-degree"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>💎 价值分布</h3>
                    <div class="chart-container"><canvas id="chart-value"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>🔗 入度 vs 出度</h3>
                    <div class="chart-container"><canvas id="chart-scatter"></canvas></div>
                </div>
            </div>
        </div>

        <div id="query" class="tab-content">
            <div class="query-section">
                <h2 style="text-align:center; margin-bottom: 20px;">🔍 成语接龙查询器</h2>
                <div class="input-group">
                    <input type="text" id="query-input" placeholder="请输入四字成语，例如：一心一意" maxlength="4">
                    <button onclick="queryIdiom()">查询</button>
                </div>
                <div id="query-result"></div>
            </div>
        </div>

        <div id="analysis" class="tab-content">
            <div id="analysis-content"></div>
        </div>
    </div>

    <script>
        // 全局数据
        let graphData = null;
        let idiomMap = {};
        let optimalMoves = {};
        let edgesByFrom = {};
        let winCount = 0, loseCount = 0;

        function switchTab(tabName, event) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        async function loadData() {
            try {
                const startTime = Date.now();
                const response = await fetch('results/web_visualization_data.json');
                if (!response.ok) throw new Error('数据加载失败');
                graphData = await response.json();
                console.log(`数据加载: ${(Date.now() - startTime) / 1000}s`);

                // 构建索引
                const nodeById = {};
                graphData.graph.nodes.forEach(node => {
                    idiomMap[node.text] = node;
                    nodeById[node.id] = node;
                    if (node.is_winning) winCount++; else loseCount++;
                });

                if (graphData.optimal_graph?.edges) {
                    graphData.optimal_graph.edges.forEach(edge => {
                        optimalMoves[edge.from_text] = edge;
                    });
                }

                // 边索引（O(edges)，用 id 查找）
                graphData.graph.edges.forEach(edge => {
                    const fromNode = nodeById[edge.from];
                    if (fromNode) {
                        if (!edgesByFrom[fromNode.text]) edgesByFrom[fromNode.text] = [];
                        const toNode = nodeById[edge.to];
                        if (toNode) {
                            edgesByFrom[fromNode.text].push(toNode.text);
                        }
                    }
                });

                // 更新统计栏
                const statsBar = document.getElementById('stats-bar');
                statsBar.innerHTML = `
                    <div class="stat-card info"><div class="label">成语总数</div><div class="value">${graphData.metadata.total_idioms.toLocaleString()}</div></div>
                    <div class="stat-card info"><div class="label">接龙关系</div><div class="value">${graphData.metadata.total_edges.toLocaleString()}</div></div>
                    <div class="stat-card winning"><div class="label">必胜态</div><div class="value">${winCount.toLocaleString()}</div></div>
                    <div class="stat-card losing"><div class="label">必败态</div><div class="value">${loseCount.toLocaleString()}</div></div>
                    <div class="stat-card gold"><div class="label">图密度</div><div class="value">${(graphData.analysis.graph_analysis.density * 100).toFixed(4)}%</div></div>
                `;

                renderCharts();
                renderAnalysis();
            } catch (error) {
                document.querySelectorAll('.loading').forEach(el => {
                    el.innerHTML = `<div class="error">错误: ${error.message}<br>请运行 python src/large_scale_experiment.py</div>`;
                });
            }
        }

        function renderCharts() {
            const nodes = graphData.graph.nodes;
            
            // 1. 必胜/必败态饼图
            new Chart(document.getElementById('chart-winloss'), {
                type: 'doughnut',
                data: {
                    labels: ['必胜态', '必败态'],
                    datasets: [{
                        data: [winCount, loseCount],
                        backgroundColor: ['#00e676', '#ff5252'],
                        borderColor: 'transparent',
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { color: '#e0e0e0' } } }
                }
            });

            // 2. 出度分布柱状图
            const degreeBins = [0, 1, 2, 3, 5, 10, 20, 50, 100, 200];
            const degreeCounts = new Array(degreeBins.length).fill(0);
            nodes.forEach(n => {
                for (let i = degreeBins.length - 1; i >= 0; i--) {
                    if (n.out_degree >= degreeBins[i]) { degreeCounts[i]++; break; }
                }
            });
            new Chart(document.getElementById('chart-degree'), {
                type: 'bar',
                data: {
                    labels: degreeBins.map((v, i) => i < degreeBins.length - 1 ? `${v}-${degreeBins[i+1]-1}` : `${v}+`),
                    datasets: [{ label: '节点数', data: degreeCounts, backgroundColor: '#448aff', borderRadius: 5 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { x: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } }, y: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } } },
                    plugins: { legend: { display: false } }
                }
            });

            // 3. 价值分布
            const valueBins = [-2, -1.5, -1, -0.5, 0, 0.5, 1, 1.5, 2];
            const valueCounts = new Array(valueBins.length).fill(0);
            nodes.forEach(n => {
                for (let i = valueBins.length - 1; i >= 0; i--) {
                    if (n.sg_value >= valueBins[i]) { valueCounts[i]++; break; }
                }
            });
            new Chart(document.getElementById('chart-value'), {
                type: 'bar',
                data: {
                    labels: valueBins.map((v, i) => i < valueBins.length - 1 ? `[${v}, ${valueBins[i+1]})` : `[${v}, ∞)`),
                    datasets: [{ label: '节点数', data: valueCounts, backgroundColor: '#764ba2', borderRadius: 5 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: { x: { ticks: { color: '#aaa', maxRotation: 45 }, grid: { color: 'rgba(255,255,255,0.05)' } }, y: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } } },
                    plugins: { legend: { display: false } }
                }
            });

            // 4. 入度vs出度散点图 (采样500个点)
            const sampled = nodes.filter((_, i) => i % Math.max(1, Math.floor(nodes.length / 500)) === 0);
            new Chart(document.getElementById('chart-scatter'), {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: '成语',
                        data: sampled.map(n => ({ x: n.in_degree, y: n.out_degree })),
                        backgroundColor: 'rgba(68, 138, 255, 0.4)',
                        pointRadius: 4,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: '入度', color: '#aaa' }, ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { title: { display: true, text: '出度', color: '#aaa' }, ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderAnalysis() {
            const a = graphData.analysis.graph_analysis;
            document.getElementById('analysis-content').innerHTML = `
                <div class="chart-grid">
                    <div class="chart-card">
                        <h3>📊 图基本统计</h3>
                        <table>
                            <tr><th>指标</th><th>值</th></tr>
                            <tr><td>节点数</td><td>${a.num_nodes.toLocaleString()}</td></tr>
                            <tr><td>边数</td><td>${a.num_edges.toLocaleString()}</td></tr>
                            <tr><td>图密度</td><td>${(a.density * 100).toFixed(6)}%</td></tr>
                            <tr><td>图稀疏度</td><td>${(a.sparsity * 100).toFixed(6)}%</td></tr>
                        </table>
                    </div>
                    <div class="chart-card">
                        <h3>📈 度分布</h3>
                        <table>
                            <tr><th>指标</th><th>值</th></tr>
                            <tr><td>平均出度</td><td>${a.avg_out_degree.toFixed(2)}</td></tr>
                            <tr><td>最大出度</td><td>${a.max_out_degree}</td></tr>
                            <tr><td>出度为0的节点</td><td>${a.zero_out_degree_count}</td></tr>
                        </table>
                    </div>
                    <div class="chart-card">
                        <h3>🔗 连通性</h3>
                        <table>
                            <tr><th>指标</th><th>值</th></tr>
                            <tr><td>连通分量数</td><td>${a.num_components}</td></tr>
                            <tr><td>最大连通分量</td><td>${a.max_component_size.toLocaleString()} 个节点</td></tr>
                        </table>
                    </div>
                    <div class="chart-card">
                        <h3>⚙️ 算法信息</h3>
                        <table>
                            <tr><th>指标</th><th>值</th></tr>
                            <tr><td>算法</td><td>价值迭代 (Value Iteration)</td></tr>
                            <tr><td>数据生成时间</td><td>${graphData.metadata.generated_at}</td></tr>
                        </table>
                    </div>
                </div>
            `;
        }

        function queryIdiom() {
            const input = document.getElementById('query-input').value.trim();
            const resultDiv = document.getElementById('query-result');
            if (input.length !== 4) { resultDiv.innerHTML = '<div class="error">请输入四字成语</div>'; return; }

            const node = idiomMap[input];
            if (!node) { resultDiv.innerHTML = `<div class="error">"${input}" 不在数据库中</div>`; return; }

            const optimal = optimalMoves[input];
            let optimalHtml = '';
            if (optimal) {
                optimalHtml = `
                    <div class="result-box">
                        <h4>🎯 最佳回应: ${optimal.to_text}</h4>
                        <span class="badge ${optimal.is_winning_to ? 'winning' : 'losing'}">${optimal.is_winning_to ? '必胜态' : '必败态'}</span>
                    </div>
                `;
            }

            const toTexts = (edgesByFrom[input] || []).map(id => idiomMap[id]?.text).filter(Boolean);
            resultDiv.innerHTML = `
                <div class="result-box">
                    <h4>📊 ${input}</h4>
                    <div class="idiom-display">${input}</div>
                    <p>出度: ${node.out_degree} | 入度: ${node.in_degree}</p>
                    <p>价值: ${node.sg_value.toFixed(3)}</p>
                    <span class="badge ${node.is_winning ? 'winning' : 'losing'}">${node.is_winning ? '必胜态' : '必败态'}</span>
                </div>
                ${optimalHtml}
                <div class="result-box">
                    <h4>📝 可接龙的成语 (前20个)</h4>
                    <p>${toTexts.slice(0, 20).join('、') || '无'}</p>
                </div>
            `;
        }
        document.getElementById('query-input').addEventListener('keypress', e => { if (e.key === 'Enter') queryIdiom(); });
        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
